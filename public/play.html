<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#13241d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Onkel Ottos Testament</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏚️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/play.css">
</head>
<body class="phone">

  <!-- Beitreten -->
  <section id="scr-join" class="pscreen">
    <div class="join-top">
      <div class="lang-switch" data-langswitch><button data-lang="de">Deutsch</button><button data-lang="tr">Türkçe</button></div>
    </div>
    <div class="join-hero">
      <div class="seal hero-seal"><span>O</span></div>
      <h1 class="display" data-i="app.title"></h1>
    </div>
    <form id="join-form" class="join-form parchment" autocomplete="off">
      <label><span data-i="p.code"></span><input id="in-code" maxlength="4" autocapitalize="characters" spellcheck="false" inputmode="text"></label>
      <label><span data-i="p.name"></span><input id="in-name" maxlength="14" spellcheck="false" enterkeyhint="go"></label>

      <div id="join-photo" class="join-photo">
        <div class="av-label" data-i="p.photoTitle"></div>
        <button type="button" class="portrait-btn" id="join-portrait"><span class="portrait-ph">📸</span></button>
        <button type="button" class="btn blood" id="join-cam"><span>📸</span><span data-i="p.takePhoto"></span></button>
        <button type="button" class="linkish" id="join-to-emoji" data-i="p.skipPhoto"></button>
      </div>
      <div id="join-emoji" class="join-emoji hidden">
        <div class="av-label" data-i="p.avatar"></div>
        <div id="av-grid" class="av-grid"></div>
        <button type="button" class="linkish" id="join-to-photo" data-i="p.backToPhoto"></button>
      </div>

      <p id="join-err" class="join-err" role="alert"></p>
      <button class="btn big blood" type="submit" id="btn-join" data-i="p.join"></button>
    </form>
  </section>

  <!-- Spiel -->
  <section id="scr-game" class="pscreen hidden">
    <header class="phead">
      <button class="me-btn" id="me-btn">
        <span id="me-medal"></span>
        <span class="me-text"><b id="me-name"></b><span id="me-money" class="money"></span></span>
      </button>
      <div class="phead-right">
        <div class="lang-switch small" data-langswitch><button data-lang="de">DE</button><button data-lang="tr">TR</button></div>
        <button class="hbtn" id="deal-btn" aria-label="Verträge">🤝<i id="deal-badge" class="badge hidden"></i></button>
        <button class="hbtn" id="chat-btn" aria-label="Chat">💬<i id="chat-badge" class="badge hidden"></i></button>
        <button class="hbtn" id="dossier-btn" aria-label="Dossier">📂</button>
      </div>
    </header>
    <div class="pbar" id="pbar"><div id="pbar-fill"></div></div>
    <main id="view" class="view"></main>
    <div id="sab-layer" class="sab-layer"></div>
  </section>

  <!-- Auswahl-Blatt -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-back" data-close></div>
    <div class="sheet-body parchment" id="sheet-body"></div>
  </div>

  <!-- Chat -->
  <div id="chat" class="chat hidden" role="dialog" aria-modal="true">
    <div class="chat-head">
      <button class="hbtn" id="chat-back" aria-label="Zurück">‹</button>
      <div class="chat-title" id="chat-title"></div>
      <button class="hbtn" id="chat-close" aria-label="Schließen">✕</button>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <form class="chat-form hidden" id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="240" enterkeyhint="send">
      <button class="btn blood" type="submit" id="chat-send">➤</button>
    </form>
  </div>

  <!-- Porträt-Studio -->
  <div id="photo" class="photo-modal hidden" role="dialog" aria-modal="true">
    <div class="photo-inner">
      <h2 class="display" id="photo-title" data-i="p.photoTitle"></h2>
      <p class="sub" id="photo-hint" data-i="p.photoHint"></p>
      <div class="cam-stage" id="cam-stage">
        <video id="cam-video" playsinline muted autoplay></video>
        <canvas id="cam-shot" class="hidden" width="256" height="256"></canvas>
        <div class="cam-ring"></div>
        <div class="cam-count" id="cam-count"></div>
        <div class="cam-flash" id="cam-flash"></div>
        <div class="cam-placeholder" id="cam-ph">📸</div>
      </div>
      <p class="sub small hidden" id="cam-note" data-i="p.noCamera"></p>
      <div class="flt-row" id="flt-row"></div>
      <div class="cam-actions">
        <button type="button" class="btn big blood" id="cam-shoot"><span>📸</span><span data-i="p.takePhoto"></span></button>
        <button type="button" class="btn ghosty hidden" id="cam-retake"><span>🔁</span><span data-i="p.retake"></span></button>
        <button type="button" class="btn big hidden" id="cam-ok">✓</button>
      </div>
      <div class="cam-alt">
        <button type="button" class="linkish" id="cam-file-btn">🖼️ <span data-i="p.pickFile"></span></button>
        <button type="button" class="linkish" id="cam-cancel" data-i="p.cancel"></button>
      </div>
      <input type="file" id="cam-file" accept="image/*" class="hidden">
      <input type="file" id="cam-native" accept="image/*" capture="user" class="hidden">
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="conn" class="conn hidden" data-i="err.conn"></div>

  <script src="/shared/data.js"></script>
  <script src="/shared/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
