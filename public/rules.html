<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regelwerk · Onkel Ottos Testament</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .bar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem 1.2rem; background: rgba(10, 20, 15, .92); backdrop-filter: blur(6px); }
    .bar a { color: var(--brass); text-decoration: none; font-weight: 700; }
    .tabs { display: flex; gap: .5rem; flex-wrap: wrap; }
    .doc { position: relative; z-index: 2; max-width: 52rem; margin: 2rem auto 4rem; padding: 2.4rem clamp(1.2rem, 4vw, 3.4rem) 3rem; line-height: 1.6; }
    .doc h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; color: var(--blood); margin: 0 0 .4rem; }
    .doc h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; margin: 2.2rem 0 .6rem; padding-bottom: .3rem; border-bottom: 2px solid rgba(42, 26, 18, .2); }
    .doc h3 { font-size: 1.15rem; margin: 1.4rem 0 .4rem; color: var(--blood); }
    .doc p, .doc li { max-width: 70ch; }
    .doc code { background: rgba(42, 26, 18, .1); padding: .1em .35em; border-radius: 5px; font-size: .92em; }
    .doc table { width: 100%; border-collapse: collapse; margin: .8rem 0 1.2rem; font-size: .95rem; }
    .doc th, .doc td { text-align: left; vertical-align: top; padding: .5rem .6rem; border-bottom: 1px solid rgba(42, 26, 18, .18); }
    .doc th { background: rgba(140, 35, 49, .1); }
    .doc tr:nth-child(even) td { background: rgba(255, 255, 255, .18); }
    .doc .tablewrap { overflow-x: auto; }
    .doc em { color: var(--ink-soft); }
    .loading { text-align: center; color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/">🏚️ <span data-t="back"></span></a>
    <div class="tabs">
      <div class="lang-switch"><button data-doc="rules">📜 <span data-t="rules"></span></button><button data-doc="clauses">🖋️ <span data-t="clauses"></span></button></div>
      <div class="lang-switch"><button data-lang="de">DE</button><button data-lang="tr">TR</button></div>
    </div>
  </div>
  <article class="doc parchment" id="doc"><p class="loading">…</p></article>
  <script>
    const T = { de: { back: 'Startseite', rules: 'Regelwerk', clauses: '100 Klauseln' }, tr: { back: 'Ana sayfa', rules: 'Kurallar', clauses: '100 Madde' } };
    const params = new URLSearchParams(location.search);
    let lang = params.get('lang') || (location.pathname === '/kurallar' ? 'tr' : (localStorage.getItem('otto.lang') === 'tr' ? 'tr' : 'de'));
    let docName = params.get('doc') === 'clauses' ? 'clauses' : 'rules';

    const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>');
    function md(src) {
      const lines = src.split('\n'); let html = ''; let i = 0;
      while (i < lines.length) {
        const l = lines[i];
        if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; html += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++; continue; }
        if (l.startsWith('|')) {
          const rows = []; while (i < lines.length && lines[i].startsWith('|')) { rows.push(lines[i]); i++; }
          const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          html += '<div class="tablewrap"><table><thead><tr>' + cells(rows[0]).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
            rows.slice(2).map(r => '<tr>' + cells(r).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
          continue;
        }
        if (/^(- |\d+\. )/.test(l)) {
          const ordered = /^\d+\. /.test(l); const items = [];
          while (i < lines.length && /^(- |\d+\. )/.test(lines[i])) { items.push(lines[i].replace(/^(- |\d+\. )/, '')); i++; }
          html += (ordered ? '<ol>' : '<ul>') + items.map(x => `<li>${inline(x)}</li>`).join('') + (ordered ? '</ol>' : '</ul>');
          continue;
        }
        if (!l.trim()) { i++; continue; }
        const para = []; while (i < lines.length && lines[i].trim() && !/^(#|\||- |\d+\. )/.test(lines[i])) { para.push(lines[i]); i++; }
        html += `<p>${inline(para.join(' '))}</p>`;
      }
      return html;
    }
    async function load() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach(el => el.textContent = T[lang][el.dataset.t]);
      document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
      document.querySelectorAll('[data-doc]').forEach(b => b.classList.toggle('on', b.dataset.doc === docName));
      const file = docName === 'clauses' ? 'KLAUSELN.md' : (lang === 'tr' ? 'KURALLAR.md' : 'REGELWERK.md');
      const res = await fetch('/docs/' + file);
      document.getElementById('doc').innerHTML = md(await res.text());
      document.title = (docName === 'clauses' ? T[lang].clauses : T[lang].rules) + ' · ' + (lang === 'tr' ? "Otto Amca'nın Vasiyeti" : 'Onkel Ottos Testament');
    }
    document.addEventListener('click', e => {
      const l = e.target.closest('[data-lang]'); if (l) { lang = l.dataset.lang; localStorage.setItem('otto.lang', lang); load(); }
      const d = e.target.closest('[data-doc]'); if (d) { docName = d.dataset.doc; load(); }
    });
    load();
  </script>
</body>
</html>
